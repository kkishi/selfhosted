# Usage (ArchiveBox v0.9+):
#     docker compose up -d
#     docker compose exec archivebox archivebox add --depth=1 'https://example.com'
#     docker compose exec archivebox archivebox help
# Upgrading: docker compose pull && docker compose run --rm archivebox init && docker compose up -d
# Documentation:
#     https://github.com/ArchiveBox/ArchiveBox/wiki/Docker#docker-compose

services:
    archivebox:
        # build: .                              # for developers working on archivebox
        # NOTE(keisuke): `master` tag stopped being updated (default branch is now `dev`); use `latest`.
        image: ${DOCKER_IMAGE:-archivebox/archivebox:latest}
        # NOTE(keisuke): No host port; accessed only via Traefik (LAN + Tailscale).
        environment:
            - BASE_URL=https://${HOSTNAME}      # canonical URL, used for redirects (required since v0.9)
            - CSRF_TRUSTED_ORIGINS=https://${HOSTNAME}
            - PUBLIC_INDEX=False                # require login to see the list of snapshots
            - PUBLIC_SNAPSHOTS=False            # require login to see snapshot contents
            - PUBLIC_ADD_VIEW=False
            - ARCHIVEDOTORG_ENABLED=False       # was SAVE_ARCHIVE_DOT_ORG (<= v0.7)
            - TIMEOUT=600
            - YTDLP_ENABLED=True                # was FETCH_MEDIA
            - YTDLP_MAX_SIZE=750m               # was MEDIA_MAX_SIZE
        volumes:
            - /tank/selfhosted/archivebox/data:/data
            # - ./archivebox:/app/archivebox    # for developers working on archivebox
            - tmp:/tmp/archivebox               # lets one-off `docker compose run` commands reuse main server's runners
        shm_size: 1gb                           # chrome runs better when it can use a decently sized shm pool
        pids_limit: 2048
        ulimits:
            nofile: 8192
        restart: unless-stopped
        labels:
            - "traefik.docker.network=traefik_default"
            - "traefik.http.routers.archivebox.rule=Host(`${HOSTNAME}`)"
            - "traefik.http.routers.archivebox.tls=true"
            - "traefik.http.routers.archivebox.tls.certresolver=production"
            - "traefik.http.services.archivebox.loadbalancer.server.port=5797"
        networks:
            - traefik_default

    # To run the Sonic full-text search backend, first download the config file to sonic.cfg
    # curl -O https://raw.githubusercontent.com/ArchiveBox/ArchiveBox/master/etc/sonic.cfg
    # after starting, backfill any existing Snapshots into the index: docker-compose run archivebox update --index-only
    # sonic:
    #    image: valeriansaliou/sonic:v1.3.0
    #    expose:
    #        - 1491
    #    environment:
    #        - SEARCH_BACKEND_PASSWORD=SecretPassword
    #    volumes:
    #        - ./sonic.cfg:/etc/sonic.cfg:ro
    #        - ./data/sonic:/var/lib/sonic/store


    ### Optional Addons: tweak these examples as needed for your specific use case

    # Example: Run scheduled imports in a docker instead of using cron on the
    # host machine, add tasks and see more info with archivebox schedule --help
    # scheduler:
    #    image: archivebox/archivebox:latest
    #    command: schedule --foreground --every=day --depth=1 'https://getpocket.com/users/USERNAME/feed/all'
    #    environment:
    #        - USE_COLOR=True
    #        - SHOW_PROGRESS=False
    #    volumes:
    #        - ./data:/data

    # Example: Put Nginx in front of the ArchiveBox server for SSL termination
    # nginx:
    #     image: nginx:alpine
    #     ports:
    #         - 443:443
    #         - 80:80
    #     volumes:
    #         - ./etc/nginx/nginx.conf:/etc/nginx/nginx.conf
    #         - ./data:/var/www

    # Example: run all your ArchiveBox traffic through a WireGuard VPN tunnel
    # wireguard:
    #   image: linuxserver/wireguard
    #   network_mode: 'service:archivebox'
    #   cap_add:
    #     - NET_ADMIN
    #     - SYS_MODULE
    #   sysctls:
    #     - net.ipv4.conf.all.rp_filter=2
    #     - net.ipv4.conf.all.src_valid_mark=1
    #   volumes:
    #     - /lib/modules:/lib/modules
    #     - ./wireguard.conf:/config/wg0.conf:ro

    # Example: Run PYWB in parallel and auto-import WARCs from ArchiveBox
    # pywb:
    #     image: webrecorder/pywb:latest
    #     entrypoint: /bin/sh 'wb-manager add default /archivebox/archive/*/warc/*.warc.gz; wayback --proxy;'
    #     environment:
    #         - INIT_COLLECTION=archivebox
    #     ports:
    #         - 8080:8080
    #     volumes:
    #         ./data:/archivebox
    #         ./data/wayback:/webarchive

networks:
  traefik_default:
    external: true

volumes:
    tmp:
