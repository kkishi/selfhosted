core:
  defaultRuleSyntax: v2

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
  websecure:
    address: ":443"

api:
  dashboard: true
  insecure: true

providers:
  docker: {}

accessLog:
  filePath: "/var/log/access.log"
  filters:
    statusCodes:
      - "400-499"

certificatesResolvers:
  staging:
    acme:
      email: keisuke.kishimoto@gmail.com
      storage: /data/letsencrypt_staging.json
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
  production:
    acme:
      email: keisuke.kishimoto@gmail.com
      storage: /data/letsencrypt_prod.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
