services:
  reverse-proxy:
    image: traefik:v3
    restart: unless-stopped
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}  # Defined in .env (not committed)
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik.yaml:/etc/traefik/traefik.yaml"
      - "./data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/log/traefik:/var/log"  # For access log
